[package]
name = "image-reducer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Safely downscale images that exceed orientation-aware bounds"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
moxcms = "0.8.1"
serde_json = "1.0.151"
thiserror = "2.0.20"
tiff = "0.11.3"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
