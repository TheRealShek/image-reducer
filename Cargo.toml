[package]
name = "image-reducer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Safely downscale images that exceed orientation-aware bounds"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
