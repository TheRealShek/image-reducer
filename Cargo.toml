[package]
name = "image-reducer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Safely downscale images that exceed orientation-aware bounds"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
fast_image_resize = { version = "6.1.0", features = ["image"] }
filetime = "0.2.29"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = "0.18.3"
img-parts = "0.4.0"
kamadak-exif = "0.6.1"
moxcms = "0.8.1"
rayon = "1.12.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
